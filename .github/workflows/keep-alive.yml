name: Keep backend warm

# Render's free tier spins the service down after ~15 min idle, causing a ~50s
# cold start on the next request. This cron pings /health every ~10 min to keep
# it awake. Public repos get free unlimited Actions minutes.
#
# Note: keeping one free web service always-on uses ~730 of the 750 free
# instance-hours/month — fine for a single service. If you upgrade Render to a
# paid always-on plan, you can delete this workflow.

on:
  schedule:
    - cron: '*/10 * * * *' # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          echo "Pinging backend..."
          curl -sS -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://open-library-api-q56i.onrender.com/health || true
