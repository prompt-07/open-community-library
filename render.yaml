# Render Blueprint for the Open Library API (backend only).
# Frontend is deployed separately on Vercel.
# Secrets (sync: false) are set in the Render dashboard, never committed.
services:
  - type: web
    name: open-library-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: MAX_RESERVATIONS_PER_SESSION
        value: "3"
      - key: OVERDUE_GRACE_DAYS
        value: "14"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
